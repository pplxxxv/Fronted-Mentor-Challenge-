<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
body {
  background-color:  hsl(47, 88%, 63%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
p {
  color:hsl(0, 0%, 0%);
}
.text p {
  font-size: 16px;
  color:hsl(0, 0%, 42%);
}
h1 {
  color:hsl(0, 0%, 7%);
  font-weight: 800;
}
 .card {
  margin: 5%;
  width:25%;
  background-color:  white;
  border: 1px solid black;
  border-radius: 20px;
  padding: 20px;
  display:flex;
  flex-direction: column;
  box-shadow: 6px 6px 0px 0 rgba(0, 0, 0);
 }
 .img-article {
  border-radius: 20px;
  height:30%;

 }
.webp {
  display: flex;
  flex-direction: row;
  align-items: center;

}
.avatar-webp {
  width:8%;
  height:8%;
}
.webp p{
  color: hsl(0, 0%, 0%);
  font-size: 14px;
  padding-left: 5%;
font-weight: 900;
}
#fon-Learning {
  background-color: hsl(47, 88%, 63%);
  border-radius: 5px;
  width: 20%;
  padding: 4px;
  text-align: center;
  font-weight: 2000;
  color:black;
}
#published {
  color: hsl(0, 0%, 7%);
}
@media (max-width:500px) {
  .card {
    margin-top: 20%;
  width:75%;
  background-color:  white;
  border: 1px solid black;
  border-radius: 20px;
  padding: 20px;
  display:flex;
  flex-direction: column;
  box-shadow: 6px 6px 0px 0 rgba(0, 0, 0);
}
#fon-Learning {
  background-color: hsl(47, 88%, 63%);
  border-radius: 5px;
  width: 24%;
  padding: 4px;
  text-align: center;
  font-weight: 2000;
  color:black;
}
}
  </style>
</head>
<body>
<main class="card">
  <img src="illustration-article.svg" alt="img-atricle" class="img-article">
  <div class="text">
    <p id="fon-Learning"><b>Learning</b></p>
    <p id="published">Published 23 Dec 2023</p>
  <h1>HTML&CSS Foundations</h1>
  <p class="grey-color">These launguages are the backbone of every website, defining structure, content and presentation.</p>
  </div>
  <div class="webp">
  <img src="image-avatar.webp" alt="avatar-webp" class="avatar-webp">
  <p>Greg Hooper</p></div>
</main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">pplxvvvn</a>.
  </footer>
</body>
</html>
